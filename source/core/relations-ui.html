<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>长明 · 关系图谱</title><style>body{font:15px system-ui;background:#171322;color:#f5eefa;margin:0;padding:22px}header{max-width:980px;margin:auto}h1{font-size:23px}input,button{background:#2e263b;color:white;border:1px solid #76668b;border-radius:10px;padding:10px;margin:4px}button{cursor:pointer}main{max-width:980px;margin:18px auto;border:1px solid #5b4a70;border-radius:18px;background:#211a2c;padding:15px}svg{width:100%;height:480px}line{stroke:#b49dca;stroke-width:1.7}circle{fill:#a786d5;stroke:#f1d9ff;stroke-width:2}text{fill:white;font-size:12px}#detail{white-space:pre-wrap;background:#30263d;border-radius:10px;padding:12px;min-height:45px}small{color:#c5b6d2}</style><header><h1>✧ 长明 · 人物关系网</h1><small>只显示已确认渠道身份与已提交的 S07 关系记忆。点击节点查看关联身份；未经确认的匹配不合并。</small><p><input id="token" type="password" placeholder="本地 Core Token" autocomplete="off"><input id="scope" value="personal" placeholder="scope"><button id="load">读取关系网</button></p><small>仅在受信本地环境使用。令牌只保存在当前页面内存，不写入浏览器存储。</small></header><main><svg id="graph" viewBox="0 0 900 480" role="img" aria-label="人物关系图谱"></svg><div id="detail">尚未连接；没有数据时显示空状态，不生成虚构人物。</div></main><script>
const ns='http://www.w3.org/2000/svg';const graph=document.getElementById('graph');const detail=document.getElementById('detail');function el(tag,attrs,parent){let n=document.createElementNS(ns,tag);for(const [k,v]of Object.entries(attrs))n.setAttribute(k,v);parent.append(n);return n}document.getElementById('load').onclick=async()=>{graph.replaceChildren();detail.textContent='读取中…';try{const scope=document.getElementById('scope').value;const r=await fetch('/api/v8/relations/graph?scope='+encodeURIComponent(scope),{headers:{authorization:'Bearer '+document.getElementById('token').value}});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();const nodes=data.people;if(!nodes.length){detail.textContent='当前没有已建立的人物节点。';return}const pos=new Map(nodes.map((n,i)=>[n.id,{x:450+320*Math.cos(2*Math.PI*i/nodes.length),y:240+170*Math.sin(2*Math.PI*i/nodes.length)}]));for(const edge of data.edges){const a=pos.get(edge.from),b=pos.get(edge.to);if(a&&b){el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y},graph);const t=el('text',{x:(a.x+b.x)/2,y:(a.y+b.y)/2},graph);t.textContent=edge.relation}}for(const n of nodes){const p=pos.get(n.id);const group=el('g',{},graph);el('circle',{cx:p.x,cy:p.y,r:27},group);const t=el('text',{x:p.x,y:p.y+45,'text-anchor':'middle'},group);t.textContent=n.label;group.style.cursor='pointer';group.onclick=()=>{detail.textContent=JSON.stringify({person_id:n.id,label:n.label,channels:n.aliases,relations:data.edges.filter(e=>e.from===n.id||e.to===n.id)},null,2)}}detail.textContent=`人物 ${nodes.length} 位 · 已提交关系 ${data.edges.length} 条 · 待确认身份 ${data.pending.length} 条。关系边只有 subject/object 使用人物 ID 时才能准确连线。`;}catch(e){detail.textContent='读取失败：'+e.message}};
</script></html>
