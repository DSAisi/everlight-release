name: Everlight isolated verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and build release asset
        run: python3 tools/build_release.py
      - name: Core and panel tests
        working-directory: source
        run: npm test
      - name: Converter tests
        working-directory: source/converter
        run: npm test
      - name: Isolated HTTP integration
        working-directory: source
        run: npm run beta:verify
